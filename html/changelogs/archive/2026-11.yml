2026-11-04:
  RandomDudeFromTheRim:
  - rscadd: "Added a Toggle Crew Markers verb to the IC tab that hides the green marker over your crewmates."
2026-11-05:
  Jackriip:
  - bugfix: "The Bogatyr's rooms behind the armory door get air, and its upgrade rooms load without broken walls."
  - bugfix: "The pink Hiryu's helm has power."
2026-11-07:
  Jackriip:
  - balance: "Money, research, missions and gear are now paced across the six-hour round. Dangerous zones pay better, and green zones still have every resource."
  - rscadd: "Crews now build a reputation from every job, which opens better contracts, trader stock and research. It stays with the crew when a ship is lost."
  - rscadd: "A crew can now run more than one ship. Each player belongs to one crew at a time, and only the crew's leader adds ships."
  - rscadd: "Trader outposts now have guarded weapons checkpoints with gun lockers, and the guard sells a personal weapons permit."
  - rscadd: "Rounds end with a fleet jump at six hours on the round clock, with a countdown and alerts before it."
  - balance: "Guns and melee weapons from loot, traders and peddlers are now tiered by zone, and traders sell guns in limited stock."
  - balance: "Military ammunition, combat exosuits, strong implants and other strong research and trader stock now need crew reputation."
  - balance: "Ore is spread by zone, spent asteroid fields move elsewhere in their zone, and ore vents run dry."
  - balance: "Mission pay now climbs with the danger of the zone, and the rarest prizes only come from dangerous guarded jobs."
  - balance: "NPCs in dangerous zones are now tougher instead of more numerous."
  - balance: "Traders and cargo no longer buy back goods bought from traders, order consoles or the black market, and cargo no longer sells guns or security gear."
  - balance: "The survey console pays research only, and survey sites wear out."
  - balance: "Cyberware capacity now counts everything installed, including implants and nanite programs."
  - rscdel: "Removed gun schematics, receiver printing, the schematic imprinter and trader favor discounts."
  - bugfix: "Fixed the reviver implant reviving people back into crit, the voltaic cyberheart, several nanite programs and the nanite remote."
  - bugfix: "The first chaplain gets a null rod, missing sabres and surgery kits spawn on their ships, and the photon cannon, HEAP rockets and plasmaman suit refills work."
  - qol: "The chrome cradle, nanite chamber console and nanite programmer show neural load from every source."
  - imageadd: "Cascade lattice afterimages now leave a rainbow trail."
  - bugfix: "Outpost NPCs no longer wander into Splice's booth."
  - bugfix: "Ship memos and nanite text settings can no longer put raw HTML into other players' chat."
  - admin: "Outpost bans can be viewed, lifted and added from Overmap Management."
  Aliceee2ch:
  - map: "Added the Patrol Bee, a small patrol cruiser with NanoTrasen and Syndicate themes and a choice of medical, science, mining, kitchen and other rooms."
2026-11-10:
  Jackriip:
  - rscadd: "Ship saves: captains can pay ship parts to save the ship they command and load it once, for free, in a later round."
  - rscadd: "Saved ships keep their rooms, upgraded weapons and lab machines, research and, for trade parts, some of their funds."
  - rscdel: "Removed outpost ship checkpoints."
  - balance: "Setting or changing a ship's join password costs 3 ship parts."
  - rscadd: "Trader outpost hangar berths have a shipyard console for saving, loading and ordering ships."
  - rscadd: "The lobby is now a dock terminal where you join crews, buy and fit ships and move into outposts from one screen."
  - rscadd: "NPC pirate crews now hunt boarders through their ship, break through locked doors and cross onto docked ships."
  - rscadd: "Pirate boarding parties hunt down your crew, and pirate crews shout to each other in a fight."
  - bugfix: "Ship-to-ship docking connects the airlocks for ships of every size."
  - bugfix: "NPCs show the weapons they're holding."
  - rscadd: "Added the bluespace damper, a ship machine that blocks teleports onto and off the ship, with field passes and keyed pads for the crew."
  - rscadd: "Added the Pattern Bleed exploit cartridge to the black market. It knocks a ship's bluespace dampers offline for a short while."
  - rscadd: "Ported cargo shelves from Monkestation. Built from four iron sheets, they hold three crates on one tile."
  - rscadd: "Loot caches can now hold permanent gene injectors."
  - tweak: "Bounty warrants burn away when their bounty closes."
  - map: "The Undertow's checkpoint guard now stands behind an open desk instead of armored glass."
  - bugfix: "Ship crews can use the sustenance vendor on the Bogatyr and Nano Bead."
2026-11-11:
  Jackriip:
  - bugfix: "Crew-only airlocks now keep out NPC boarders, who have to break the doors down."
  - bugfix: "Nanite clouds over capacity no longer freeze, and public nanite chambers change your cloud again."
  - qol: "The nanite cloud console shows each backup's load and lets you reorder programs, and scans list programs that didn't install."
  - bugfix: "The construction console's RCD works on ships loaded from a save."
2026-11-15:
  Jackriip:
  - rscadd: "Ported Shiptest's gun feel: guns kick the camera, flash at the muzzle and throw casings that bounce and skid."
  - rscadd: "Bullets streak through the air, impacts sound like what they hit, and near misses whizz past."
  - soundadd: "New gunshot sounds, and reload sounds for SMGs, rifles and machine guns."
  - balance: "Bullets fly about twice as fast."
  - bugfix: "Bogatyr and Hiryu crews spawn with their full kit."
  - rscadd: "Ghosts can teleport straight to each trader outpost by name."
2026-11-16:
  Jackriip:
  - rscadd: "Pirates, boarders, ruin troopers, bounty criminals, prisoners, townsfolk and mission NPCs are now real people with wounds, crit, cuffs and medicine."
  - rscadd: "Bounty criminals carry real weapons and some carry chrome, surrender when beaten, and a new cyberpsycho joins the Most Wanted."
  - balance: "Pirate and criminal gear can no longer be looted."
  - rscadd: "Rescued pod and lifeboat survivors thank the crew with ship parts and raise its reputation when let go at a trader outpost."
  - rscadd: "Hits, wounds and severed limbs read as one combat line. Blood sprays, pools and smears, limbs and heads fly off, and bodies fall over."
  - rscadd: "Added point-blank gun executions on helpless targets, aimed crits to the eyes, tongue, throat and skull, and boss finishers."
  - rscadd: "Added street and milspec chrome models, a street ripperdoc at Quartermain Depot, and new chrome and optics."
  - rscadd: "Mantis Blades, Gorilla Arms and the Widowline have new attacks and finishers."
  - rscadd: "The chrome wheel (V) replaces the chrome action buttons, and chrome optics can zoom."
  - rscadd: "A Sandevistan surge slows the world around you and replays the fight afterward."
  - rscadd: "Mission sites are dressed with wreckage and flares, survivors call for help, and defender waves arrive by drop pod or dig out of the ground."
  - rscadd: "Traders pay more for rare goods, and the rarest pay trade vouchers."
  - rscadd: "A tutorial checklist opens on spawn with short guides to ships, contracts, combat and more. It can be closed or turned off."
  - rscdel: "Removed the orientation briefing popup."
  - rscadd: "Added the Kestrel laser pistol, Hornet laser SMG, Cinder plasma pistol and Furnace plasma rifle."
  - rscadd: "Plasma bolts leave slag burns and can melt off a badly hurt limb."
  - rscadd: "Ported guns from Nova Sector and Shiptest, including the Rapier, Zashch, Rattlesnake, Woodsman, SKM-24 and a set of lever-actions and shotguns."
  - rscadd: "The NT BR-38, Ansem pistols, lethal cycler shotgun, harpoon gun and rocket launcher can now be bought or found."
  - rscdel: "Removed the Quiet Word pistol."
  - balance: "Lasers now hit instantly."
  - rscadd: "Wick's Fitting Bay at Quartermain is now the Rig Bay, selling whole mechs off chained stands, plus mech weapons, ammo and fittings."
  - rscadd: "Ported walkmans and cassette tapes from Voidcrew-LRP, sold at Waystation Halcyon."
  - tweak: "Trader outpost jukeboxes play music on their own while players are near."
  - soundadd: "New ambient sounds for planets, open space and space ruins."
  - rscdel: "Removed the roundstart security advisory and the station welcome messages."
  - tweak: "Announcements without a sender now come from Sector Broadcast, and alert levels are worded for ships."
  - rscadd: "The round-end report shows each ship's status, funds, research, missions, reputation and crew."
  - bugfix: "The lobby no longer plays the same song two rounds in a row."
2026-11-21:
  Jackriip:
  - balance: "Only the captain can order a bluespace jump, and the crew votes on it first."
  - rscadd: "The lobby terminal is redesigned, with the character editor, game settings and keybindings inside it."
  - tweak: "Auto-translate targets English by default for players who haven't picked a language."
  - rscadd: "Knives can cut the throat of a helpless person from behind, and someone with a cut throat can't speak while it bleeds."
  - rscadd: "Grabbing someone by the neck with a gun drawn holds them in front of you as a hostage."
  - balance: "A held shield no longer stops shots that hit you in the back."
  - admin: "Added a scav chop shop ruin guarded by patrols and cameras, loadable by admins."
2026-11-22:
  Jackriip:
  - rscadd: "Ships now visibly land on and take off from planets, seen from the ground and from aboard, with new sounds."
  - bugfix: "Cloned captains keep their Ship Management button."
  - bugfix: "Hacker aliases no longer accept invalid symbols."
  - rscadd: "Added a Discord key to the lobby menu."
