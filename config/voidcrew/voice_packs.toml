# Voice Packs Configuration - Ported from Monkestation
# Thanks to Monkestation, SPLURT, FluffySTG and Citadel
#
# The basic design: We use primarily short instrument samples for barks.
# Short instrument samples tend to sound surprisingly nice for barks,
# being able to be played in rapid succession without being outright obnoxious.
# Anything that works well as a stab (short attack, no sustain, decent release)
# also works extremely well for barks.

# --------- Miscellaneous Sounds ---------

[misc]
name = "Miscellaneous"

[misc.beep]
name = "Beep"
path = "sound/machines/terminal/terminal_select.ogg"
