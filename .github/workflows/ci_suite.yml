name: CI Suite

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map parser dependency
        run: python -m pip install bidict==0.22.0

      - name: Test ship asset validation
        run: python -m unittest tools.ci.test_ship_assets

      - name: Validate ship asset references
        run: python -m tools.ci.check_ship_assets --github

      - name: Test ship research server validation
        run: python -m unittest tools.ci.test_ship_research_servers

      - name: Validate ship research servers
        run: python -m tools.ci.check_ship_research_servers --github

      - name: Test ship preview freshness check
        run: python -m unittest tools.ci.test_ship_previews

      - name: Check ship previews match their maps
        run: python -m tools.ci.check_ship_previews --github

      - name: Setup Bun
        uses: ./.github/actions/setup_bun

      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond

      - name: Compile
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/build/build.sh --ci dm -DCIBUILDING -DCITESTING -DALL_MAPS
